# Sample adopter config: a FastAPI API (with a background worker and scheduler) and two
# React SSR apps (admin and storefront), on Postgres, Redis, Meilisearch and MinIO.
version: 1
label: blacksmith                 # trigger label
branch_prefix: blacksmith/issue-  # branch per issue
allowed_labelers: []   # empty = anyone with write access; list GitHub logins to restrict further
droplet:
  size: s-4vcpu-8gb
  region: fra1
  image: ubuntu-24-04-x64
limits:
  first_run_minutes: 120          # stages 1–6 wall clock
  review_round_minutes: 45
  max_turns_per_stage: 200
  lifetime_hours: 168             # hard cap, droplet self-destructs after 7 days
setup:                            # run once by bootstrap, as the agent user, in repo root
  - cd api && uv venv --python 3.12 && uv pip install -e . "pyvips[binary]" ruff pytest
  - cd admin && npm ci
  - cd storefront && npm ci
checks_setup:                     # run once before checks (pytest needs Postgres/Redis/Meili on localhost)
  - docker compose -f ops/docker-compose.dev.yml up -d --wait
checks:                           # what "verify" must run; `soft: true` is reported, not required
  - run: cd api && .venv/bin/ruff check . && .venv/bin/ruff format --check .
    soft: true                    # lint is reported, not required
  - run: cd admin && npm run typecheck
  - run: cd storefront && npm run typecheck
  - run: cd api && .venv/bin/pytest -q
preview:
  compose: ops/docker-compose.prod.yml
  project: blacksmith-preview
  build:                          # services whose `image:` is replaced by a build from the branch
    api: api
    worker: api
    beat: api
    admin: admin
    storefront: storefront
  # MinIO recipe: minio/minio:latest is no longer pullable, so the preview runs the Bitnami
  # image, which has a different data path and no `mc`, and creates the public bucket itself
  # (replacing minio-init). `reset` clears the prod keys that do not fit; `overrides` are
  # compose service fragments applied last.
  reset:
    minio: [command, healthcheck, volumes]
  overrides:
    minio:
      image: bitnamilegacy/minio:2025.4.22
      environment:
        MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-sampleshop}"
        MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY}"
        MINIO_DEFAULT_BUCKETS: "product-images:download"
      volumes: ["minio-data:/bitnami/minio/data"]
      healthcheck:
        test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 10
  drop: [minio-init]              # services to leave out of the preview
  env_example: ops/.env.prod.example   # copied to .env; `change-me` / empty values get generated
  env:                                 # explicit overrides written to .env after generation
    COOKIE_SECURE: "true"
    MINIO_PUBLIC_URL: "https://${PREVIEW_HOST}/media/product-images"
  infra: [db, minio, redis, meilisearch]   # brought up first, before `seed`
  seed: docker compose run --rm api python scripts/init_dev_db.py   # runs before the app services
  routes:                              # Caddy, in order; targets are compose service:port
    - { path: "/admin*",  to: "admin:3000" }
    - { path: "/media/*", to: "minio:9000", rewrite: "/media/* -> /*" }
    - { path: "/*",       to: "storefront:3001" }
  ready: "https://${PREVIEW_HOST}/"    # URL that must return 2xx/3xx before "preview up"
  auth: basic                          # Caddy basic auth; credentials generated per droplet, posted in the PR body
design:
  figma: true                     # enable the design-check stage when FIGMA_API_KEY is set
  paths: ["storefront/"]          # only changes under these paths trigger it
observability:
  enabled: false                  # true ships droplet/agent logs and metrics to Grafana Cloud
  loki_url: https://logs-prod-000.grafana.net/loki/api/v1/push        # Grafana Cloud > Loki > Details > URL
  loki_user: "000000"             # Grafana Cloud > Loki > Details > User
  prometheus_url: https://prometheus-prod-00-prod-eu-west-0.grafana.net/api/prom/push   # Grafana Cloud > Prometheus > Details > URL
  prometheus_user: "000000"       # Grafana Cloud > Prometheus > Details > User (required when prometheus_url is set)
  grafana_url: https://your-stack.grafana.net   # your Grafana stack URL, used for links in the PR
  public: auto                    # auto | true | false: whether this issue's dashboard is shared publicly
  agent_stream: true              # stream the agent's own output to Loki as well
  loki_datasource_uid: grafanacloud-logs      # Grafana > Connections > Data sources > Loki > UID (in the URL)
  prometheus_datasource_uid: grafanacloud-prom   # Grafana > Connections > Data sources > Prometheus > UID
