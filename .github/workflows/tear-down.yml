# Reusable workflow: destroy the preview droplet of an issue and clean up after it.
# Shares the spin-up concurrency group, so a tear-down never races a spin-up of the same issue.
# Secrets reach steps only through `env:`, never on a command line.
name: blacksmith tear-down

on:
  workflow_call:
    inputs:
      issue:
        description: Issue number whose droplet to destroy.
        type: number
        required: true
      repo:
        description: Target repository as owner/name.
        type: string
        default: ${{ github.repository }}
      config_path:
        description: Path of the blacksmith config inside the target repository.
        type: string
        default: blacksmith.yml
      template_ref:
        description: Tag, branch or commit of the template repository.
        type: string
        default: v1
      template_repo:
        description: Template repository as owner/name (point forks at themselves).
        type: string
        default: s0b0lev/agentic-blacksmith
      state_bucket:
        description: DigitalOcean Spaces bucket holding the Terraform state.
        type: string
        required: true
      spaces_endpoint:
        description: Spaces S3 endpoint of the state bucket.
        type: string
        default: https://fra1.digitaloceanspaces.com
      preview_zone:
        description: DigitalOcean-managed DNS zone for preview hosts; empty uses nip.io.
        type: string
        default: ""
      base_branch:
        description: Base branch for the work branch; empty means the repository's default branch.
        type: string
        default: ""
      telegram_chat_id:
        description: Telegram chat id that receives stage notifications; empty disables them.
        type: string
        default: ""
    secrets:
      DIGITALOCEAN_TOKEN:
        required: true
      SPACES_ACCESS_KEY_ID:
        required: true
      SPACES_SECRET_ACCESS_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      BLACKSMITH_GITHUB_TOKEN:
        required: true
      FIGMA_API_KEY:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false

permissions:
  contents: read

# Explicit bash runs with -eo pipefail, so a failing command in a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  tear-down:
    runs-on: ubuntu-latest
    concurrency:
      group: blacksmith-issue-${{ inputs.issue }}
      cancel-in-progress: false
    env:
      REPO: ${{ inputs.repo }}
      ISSUE: ${{ inputs.issue }}
      CONFIG_PATH: ${{ inputs.config_path }}
    steps:
      - name: Check secrets
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BLACKSMITH_GITHUB_TOKEN: ${{ secrets.BLACKSMITH_GITHUB_TOKEN }}
        run: |
          missing=()
          for name in DIGITALOCEAN_TOKEN SPACES_ACCESS_KEY_ID SPACES_SECRET_ACCESS_KEY \
                      CLAUDE_CODE_OAUTH_TOKEN BLACKSMITH_GITHUB_TOKEN; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Checkout template
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.template_repo }}
          ref: ${{ inputs.template_ref }}
          path: template
          persist-credentials: false

      # Destroy must not depend on the target config still being valid: the values below are
      # passed when they can be read and otherwise fall back to the Terraform defaults.
      - name: Checkout target repository config
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repo }}
          token: ${{ secrets.BLACKSMITH_GITHUB_TOKEN }}
          path: target
          sparse-checkout: ${{ inputs.config_path }}
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Read config
        env:
          GH_TOKEN: ${{ secrets.BLACKSMITH_GITHUB_TOKEN }}
          BASE_BRANCH_INPUT: ${{ inputs.base_branch }}
        run: |
          get() {
            PYTHONPATH=template/agent python3 -m blacksmith config --get "$1" --config "target/$CONFIG_PATH"
          }
          if size="$(get droplet.size)" && region="$(get droplet.region)" \
             && image="$(get droplet.image)" && lifetime="$(get limits.lifetime_hours)" \
             && label="$(get label)"; then
            {
              echo "TF_VAR_droplet_size=$size"
              echo "TF_VAR_droplet_region=$region"
              echo "TF_VAR_droplet_image=$image"
              echo "TF_VAR_lifetime_hours=$lifetime"
              echo "TF_VAR_label=$label"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::cannot read $CONFIG_PATH in $REPO; destroying with Terraform defaults for droplet settings and label"
          fi
          base="$BASE_BRANCH_INPUT"
          if [ -z "$base" ]; then
            base="$(gh api "repos/$REPO" --jq .default_branch || true)"
          fi
          if [ -n "$base" ]; then
            echo "TF_VAR_base_branch=$base" >> "$GITHUB_ENV"
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: template/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          STATE_BUCKET: ${{ inputs.state_bucket }}
          SPACES_ENDPOINT: ${{ inputs.spaces_endpoint }}
        run: |
          slug="$(tr '[:upper:]/' '[:lower:]-' <<<"$REPO")"
          terraform init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=blacksmith/$slug/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="endpoints={s3=\"$SPACES_ENDPOINT\"}" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_s3_checksum=true" \
            -backend-config="use_path_style=false"

      - name: Select issue workspace
        id: ws
        working-directory: template/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
        run: |
          # A failing list (Spaces outage, rotated keys) fails the step; only a workspace
          # that is really absent counts as "nothing to destroy".
          workspaces="$(terraform workspace list)"
          # `terraform workspace list` prints "  <name>", or "* <name>" for the current one.
          if ! grep -qxF -e "  issue-$ISSUE" -e "* issue-$ISSUE" <<<"$workspaces"; then
            echo "::notice::no Terraform workspace issue-$ISSUE; nothing to destroy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          terraform workspace select "issue-$ISSUE"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Terraform destroy
        if: steps.ws.outputs.skip != 'true'
        working-directory: template/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          TF_VAR_do_token: ${{ secrets.DIGITALOCEAN_TOKEN }}
          TF_VAR_repo: ${{ inputs.repo }}
          TF_VAR_issue_number: ${{ inputs.issue }}
          TF_VAR_preview_zone: ${{ inputs.preview_zone }}
          TF_VAR_config_path: ${{ inputs.config_path }}
          TF_VAR_template_ref: ${{ inputs.template_ref }}
          TF_VAR_template_repo: ${{ inputs.template_repo }}
          TF_VAR_claude_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TF_VAR_github_token: ${{ secrets.BLACKSMITH_GITHUB_TOKEN }}
          TF_VAR_figma_api_key: ${{ secrets.FIGMA_API_KEY }}
          TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TF_VAR_telegram_chat_id: ${{ inputs.telegram_chat_id }}
          # TF_VAR_base_branch, TF_VAR_label, TF_VAR_droplet_size, TF_VAR_droplet_region,
          # TF_VAR_droplet_image and TF_VAR_lifetime_hours come from "Read config" via $GITHUB_ENV.
        run: terraform destroy -auto-approve -input=false

      - name: Delete issue workspace
        if: steps.ws.outputs.skip != 'true'
        working-directory: template/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
        run: terraform workspace select default && terraform workspace delete "issue-$ISSUE"

      - name: Delete assets branch
        if: steps.ws.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.BLACKSMITH_GITHUB_TOKEN }}
        run: gh api -X DELETE "repos/$REPO/git/refs/heads/blacksmith-assets/issue-$ISSUE" || true

      - name: Post tear-down comment
        if: steps.ws.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.BLACKSMITH_GITHUB_TOKEN }}
        run: |
          target="$(gh pr list --repo "$REPO" --head "blacksmith/issue-$ISSUE" --state all \
            --json number --jq '.[0].number // empty')"
          target="${target:-$ISSUE}"
          body="$(printf 'Preview server destroyed.\n\n<!-- blacksmith:tear-down -->')"
          gh api -X POST "repos/$REPO/issues/$target/comments" -f body="$body" > /dev/null
